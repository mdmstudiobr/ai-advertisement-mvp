version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    restart: always
    environment:
      - OLLAMA_ORIGINS=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - app-network

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-network

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: always
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  ollama:

networks:
  app-network:
    driver: bridge